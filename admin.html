<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM SIMPLES</title><style>*{box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff;padding:15px}.card{background:#111;padding:15px;border-radius:10px;border:1px solid #333;margin-bottom:15px}input{width:100%;padding:10px;margin:5px 0;background:#222;border:none;color:#fff;border-radius:5px}.btn{background:#ffcc00;color:#000;padding:12px;border:none;border-radius:8px;font-weight:bold;width:100%;margin-top:8px}</style></head><body>
<h2 style="color:#ffcc00">👑 PAINEL SIMPLES - ANJOS AG</h2>
<div class="card" id="lista"></div>
<button class="btn" onclick="add()">+ Adicionar Cargo</button>
<button class="btn" style="background:#fff" onclick="gerar()">💾 GERAR CÓDIGO PRO SITE</button>
<div class="card"><textarea id="saida" style="width:100%;height:200px;background:#000;color:#0f0;padding:10px"></textarea><p style="font-size:12px;color:#888">Copia esse código e cola dentro do seu index.html</p></div>
<script>
let funcoes=JSON.parse(localStorage.getItem("funcoes")||'[{"cargo":"👑 LÍDER","nick":"ANJOS•LIDER","desc":"Dono"},{"cargo":"🛡️ VICE","nick":"ANJOS•VICE","desc":"Gerencia"},{"cargo":"💥 RUSHER","nick":"RUSHER","desc":"Frente"}]');
function render(){let h="";funcoes.forEach((f,i)=>{h+=`<div style="background:#1a1a1a;padding:10px;border-radius:8px;margin-bottom:8px"><input value="${f.cargo}" oninput="funcoes[${i}].cargo=this.value" placeholder="Cargo"><input value="${f.nick}" oninput="funcoes[${i}].nick=this.value" placeholder="Nick"><input value="${f.desc}" oninput="funcoes[${i}].desc=this.value" placeholder="Descrição"><span onclick="del(${i})" style="color:red;cursor:pointer">❌ remover</span></div>`});document.getElementById("lista").innerHTML=h;localStorage.setItem("funcoes",JSON.stringify(funcoes))}
function add(){funcoes.push({cargo:"NOVO",nick:"Nick",desc:"Função"});render()}
function del(i){funcoes.splice(i,1);render()}
function gerar(){let html="";funcoes.forEach(f=>{html+=`<div class=\\"func\\"><b>${f.cargo}</b><span>${f.nick}</span><small>${f.desc}</small></div>`});document.getElementById("saida").value=html;alert("Código gerado! Copia e cola no index.html onde tá FUNC_GRID")}
render();
</script></body></html>
