<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM - ANJOS AG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.login{height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#111;padding:30px;border-radius:15px;border:2px solid #ffcc00;text-align:center;width:90%;max-width:350px}
.box h1{color:#ffcc00;margin-bottom:15px}
.box input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#222;color:#fff}
.btn{background:#ffcc00;color:#000;padding:12px 30px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
.painel{display:none;padding:20px;max-width:900px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;background:#111;padding:15px;border-radius:10px;border:1px solid #333;margin-bottom:20px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-bottom:20px}
.card{background:#111;padding:20px;border-radius:10px;text-align:center;border:1px solid #333}
.card b{font-size:28px;color:#ffcc00;display:block}
.list{background:#111;padding:20px;border-radius:10px;border:1px solid #333}
.item{background:#1a1a1a;padding:12px;border-radius:8px;display:flex;justify-content:space-between;margin-bottom:8px}
.tag{padding:4px 8px;border-radius:5px;font-size:11px;font-weight:bold}
.on{background:#00ff88;color:#000} .off{background:#ff4444}
</style>
</head>
<body>

<div id="telaLogin" class="login">
<div class="box">
<h1>ANJOS - AG</h1>
<p>Painel do Líder</p>
<input type="password" id="senha" placeholder="Senha de ADM">
<button class="btn" onclick="logar()">ENTRAR</button>
<p id="erro" style="color:#ff4444;margin-top:10px;display:none">Senha errada!</p>
</div>
</div>

<div id="painel" class="painel">
<div class="header">
<h2 style="color:#ffcc00">👑 PAINEL ANJOS AG</h2>
<button class="btn" style="width:auto;padding:8px 15px" onclick="location.reload()">Sair</button>
</div>

<div class="stats">
<div class="card"><b id="total">12</b>Membros</div>
<div class="card"><b id="online">8</b>Online</div>
<div class="card"><b>LVL 6</b>Guilda</div>
</div>

<div class="list">
<h3 style="margin-bottom:15px">⚔️ Membros da Guilda</h3>
<div id="lista"></div>
<br>
<input type="text" id="novoNick" placeholder="Nick do novo membro" style="width:70%;padding:10px;border-radius:8px;border:none;background:#222;color:#fff">
<button class="btn" style="width:28%;margin-left:2%" onclick="add()">Add</button>
</div>
<br>
<div class="list">
<h3>🔗 Links Rápidos</h3>
<p style="margin-top:10px;color:#ccc">Site público: <a href="/" style="color:#ffcc00">angels-ag-create.vercel.app</a></p>
<p style="margin-top:5px;color:#ccc">WhatsApp Guilda: <a href="https://wa.me/5511910813256" style="color:#ffcc00">5511910813256</a></p>
</div>
</div>

<script>
const SENHA = "ANJOS2026";
let membros = JSON.parse(localStorage.getItem("anjos_membros")) || ["ANJOS•LIDER","ANJOS•RUSH","ANJOS•SNIPER","ANJOS•SUPORTE"];

function logar(){
 if(document.getElementById("senha").value === SENHA){
   document.getElementById("telaLogin").style.display="none";
   document.getElementById("painel").style.display="block";
   render();
 } else {
   document.getElementById("erro").style.display="block";
 }
}
function render(){
 document.getElementById("total").innerText = membros.length;
 document.getElementById("online").innerText = Math.floor(membros.length*0.7);
 let h="";
 membros.forEach((n,i)=>{
   h+=`<div class="item"><span>👤 ${n}</span><span><span class="tag ${i%3==0?'off':'on'}">${i%3==0?'OFF':'ON'}</span> <span onclick="del(${i})" style="cursor:pointer;margin-left:8px">❌</span></span></div>`;
 });
 document.getElementById("lista").innerHTML=h;
 localStorage.setItem("anjos_membros",JSON.stringify(membros));
}
function add(){
 let v=document.getElementById("novoNick").value;
 if(v){membros.push(v);document.getElementById("novoNick").value="";render();}
}
function del(i){membros.splice(i,1);render();}
</script>
</body>
</html>
