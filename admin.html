<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM PRO</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff}.header{display:flex;justify-content:space-between;align-items:center;background:#161616;padding:15px 20px;border:1px solid #222;border-radius:12px;margin:10px}.header h2{color:#ffcc00}.btn-sair{background:#ffcc00;color:#000;padding:8px 18px;border-radius:10px;border:none;font-weight:bold}.card{background:#121212;border:1px solid #222;border-radius:15px;padding:15px;margin:10px}.card h3{color:#fff;margin-bottom:4px}.card p{color:#666;font-size:12px;margin-bottom:12px}.item{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:#1a1a1a;padding:10px;border-radius:10px;margin-bottom:8px;align-items:center}.item input{background:#222;border:none;color:#fff;padding:10px;border-radius:8px;font-size:13px}.btn-yellow{background:#ffcc00;color:#000;width:100%;padding:15px;border:none;border-radius:12px;font-weight:bold;font-size:14px;margin-top:10px;cursor:pointer}.btn-dark{background:#1e1e1e;color:#fff;width:100%;padding:12px;border:none;border-radius:12px;margin-top:10px;cursor:pointer}.login{height:100vh;display:flex;align-items:center;justify-content:center}.box{background:#111;padding:30px;border-radius:15px;border:2px solid #ffcc00;text-align:center;width:90%;max-width:350px}.box input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#222;color:#fff}</style>
</head>
<body>
<div id="telaLogin" class="login"><div class="box"><h1 style="color:#ffcc00">ANJOS AG</h1><input type="password" id="senha" placeholder="Senha: ANJOS2026"><button class="btn-yellow" onclick="logar()">ENTRAR</button></div></div>
<div id="painel" style="display:none">
<div class="header"><h2>👑 PAINEL</h2><button class="btn-sair" onclick="location.reload()">Sair</button></div>
<div class="card"><h3>⚔️ FUNÇÕES (salva pra todo mundo)</h3><p>Edite e clique em SALVAR NA NUVEM. Todos verão.</p><div id="lista">Carregando...</div><button class="btn-yellow" id="btnSalvar" onclick="salvar()">☁️ SALVAR NA NUVEM</button><button class="btn-dark" onclick="add()">+ Adicionar</button><p id="status" style="text-align:center;margin-top:10px;font-size:13px;color:#ffcc00"></p></div>
<div class="card"><a href="/" style="color:#ffcc00">Ver Site →</a> | API: c41bd5bb4a6aae966dc7</div>
</div>
<script>
const API="https://api.npoint.io/c41bd5bb4a6aae966dc7";
let funcoes=[];
async function logar(){
if(document.getElementById("senha").value!=="ANJOS2026"){alert("Senha errada");return;}
document.getElementById("telaLogin").style.display="none";document.getElementById("painel").style.display="block";
carregar();
}
async function carregar(){
try{
let r=await fetch(API); // GET direto funciona
funcoes=await r.json();
render();
}catch(e){document.getElementById("lista").innerHTML="Erro: JSON da nuvem quebrado. Arruma no npoint.io";}
}
function render(){let h="";funcoes.forEach((f,i)=>{h+=`<div class="item"><input value="${f.cargo}" oninput="funcoes[${i}].cargo=this.value"><input value="${f.nick}" oninput="funcoes[${i}].nick=this.value"><input value="${f.desc}" oninput="funcoes[${i}].desc=this.value"><span onclick="funcoes.splice(${i},1);render()" style="cursor:pointer;color:#ff4444">✕</span></div>`});document.getElementById("lista").innerHTML=h;}
function add(){funcoes.push({cargo:"⭐ NOVO",nick:"NICK",desc:"Descrição"});render();}
async function salvar(){
document.getElementById("status").innerText="Salvando...";document.getElementById("btnSalvar").disabled=true;
try{
let res=await fetch("https://corsproxy.io/?"+encodeURIComponent(API),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(funcoes)});
if(res.ok){document.getElementById("status").innerText="✅ SALVO PRA TODO MUNDO! Vai no site e dá F5 em 10s";}
else{throw "erro"}
}catch(e){document.getElementById("status").innerText="❌ Erro. Tenta de novo em 5s. Se persistir me avisa."}
document.getElementById("btnSalvar").disabled=false;
}
</script>
</body>
</html>
