<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANJOS AG - Guilda Free Fire</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}.hero{text-align:center;padding:40px 15px;background:linear-gradient(180deg,#1a1a00,#000)}.hero h1{color:#ffcc00;font-size:32px}.hero p{color:#888;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:15px}.func{background:#111;border:1px solid #222;border-radius:12px;padding:14px}.func b{display:block;color:#ffcc00;font-size:16px}.func span{display:block;color:#fff;margin:4px 0}.func small{color:#777}.top{padding:12px;display:flex;justify-content:space-between;align-items:center;background:#111;border-bottom:1px solid #222}.top a{color:#ffcc00;text-decoration:none;font-weight:bold}</style>
</head>
<body>
<div class="top"><b style="color:#ffcc00">ANJOS AG</b><a href="/admin.html">ADM</a></div>
<div class="hero"><h1>ANJOS AG</h1><p>Guilda competitiva Free Fire • ID 3054921821</p></div>
<div id="funcGrid" class="grid">Carregando funções...</div>
<script>
const API="https://crudcrud.com/api/cd724d106314432c97e0f4260a9ca856/funcoes";
async function load(){
 try{
  let r=await fetch(API); let data=await r.json();
  let funcoes=data.length>0?data[0].dados:[];
  let g=document.getElementById("funcGrid"); g.innerHTML="";
  if(funcoes.length==0){g.innerHTML="Nenhuma função ainda. Vá no ADM e salve."; return;}
  funcoes.forEach(f=>{g.innerHTML+=`<div class="func"><b>${f.cargo}</b><span>${f.nick}</span><small>${f.desc}</small></div>`});
 }catch(e){document.getElementById("funcGrid").innerHTML="Erro ao carregar. Tente F5";}
}
load();
</script>
</body>
</html>
